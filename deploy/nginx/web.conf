# Konfigurasi nginx untuk container cafe-pos-web.
# Melayani PWA statis + fallback SPA. TLS diterminasi di reverse proxy (Traefik/NPM).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Kompresi
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (header TLS/HSTS ditambahkan reverse proxy).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Health check internal (dipakai Docker HEALTHCHECK, tidak untuk publik).
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Service worker & manifest tidak boleh di-cache lama.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Aset ber-hash: cache panjang.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API tidak dilayani di sini — reverse proxy merutekan /api langsung ke backend.
  # Jika permintaan /api sampai ke sini, kembalikan 502 eksplisit (konfigurasi proxy salah).
  location /api/ {
    return 502 "API tidak tersedia melalui container web\n";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
