<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="description" content="Kione POS — aplikasi kasir offline-first untuk kafe, restoran, dan ritel." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter.woff2" crossorigin />
    <title>Kione POS</title>
    <!--
      CSS kritis — HARUS inline di sini, bukan di src/index.css: CSS aplikasi baru
      terpasang setelah JavaScript jalan (di mode dev disuntikkan Vite), sehingga markup
      #portrait-lock di bawah sempat tampil polos ("Putar perangkat…") di setiap refresh.
      Gerbang orientasi diputuskan CSS sejak gambar pertama, tanpa state JS.
      Hanya untuk layar sentuh (tablet/HP) yang potret atau sempit — laptop/desktop
      tak pernah dikunci. Di APK Android orientasi juga dikunci lewat AndroidManifest.
      Halaman pelanggan (/order/*, dll.) memakai body.customer-view → tak dikunci.
    -->
    <style>
      html, body, #root { height: 100%; }
      /* Sama dengan kanvas aplikasi & splash: tak ada kedip putih sebelum splash React. */
      body { margin: 0; background: rgb(241 245 249); }
      #portrait-lock { display: none; }
      @media (pointer: coarse) and (orientation: portrait), (pointer: coarse) and (max-width: 760px) {
        body:not(.customer-view) #portrait-lock {
          position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
          padding: 2rem; background: rgb(241 245 249); color: #1e293b; text-align: center;
          font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body:not(.customer-view) #root { display: none; }
      }
      .portrait-lock__inner { display: flex; max-width: 22rem; flex-direction: column; align-items: center; gap: 0.75rem; }
      .portrait-lock__logo { width: 11rem; height: auto; margin-bottom: 0.25rem; }
      .portrait-lock__title { margin: 0; font-size: 1.15rem; font-weight: 600; color: #0f172a; }
      .portrait-lock__sub { margin: 0; font-size: 0.85rem; color: #64748b; }
    </style>
  </head>
  <body class="overscroll-none">
    <div id="portrait-lock">
      <div class="portrait-lock__inner">
        <img src="/brand/logo-full.png" alt="Kione POS" class="portrait-lock__logo" loading="lazy" />
        <p class="portrait-lock__title">Putar perangkat ke mode lanskap</p>
        <p class="portrait-lock__sub">Layar kasir dirancang untuk tablet dalam posisi horizontal.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
