name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe_pos_test
          POSTGRES_PASSWORD: cafe_pos_test
          POSTGRES_DB: cafe_pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cafe_pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cafe_pos_test:cafe_pos_test@localhost:5432/cafe_pos_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run migrate
      - name: Test
        shell: bash
        run: |
          set +e
          node -e "console.log('node', process.version, process.platform, process.arch)" | tee -a "$GITHUB_STEP_SUMMARY"
          node ./node_modules/vitest/vitest.mjs run --reporter=verbose --no-color > vitest-out.txt 2>&1
          rc=$?
          echo "----- vitest output (exit $rc) -----"
          cat vitest-out.txt
          { echo '```'; tail -n 120 vitest-out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-vitest-out, path: backend/vitest-out.txt, retention-days: 7 }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-sync:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: (cd backend && npm ci)
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-sync-report, path: playwright-report/, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image web
        run: docker build -t cafe-pos-web:ci .
      - name: Build image api
        run: docker build -t cafe-pos-api:ci ./backend
      - name: Validate compose
        working-directory: deploy
        run: |
          cp .env.example .env
          printf '\nSYNC_DEVICE_KEYS=ci\nPOSTGRES_PASSWORD=ci\n' >> .env
          docker compose -p cafe-pos-ci --env-file .env -f docker-compose.yml config >/dev/null
